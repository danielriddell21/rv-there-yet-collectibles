<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: a road-trip overworld. Road-sign map tabs, then the map itself (a winding road through every checkpoint), then a filter bar and the item shelf for whatever stop is picked. */
:root{
  --bg:#e7eee9; --panel:#f8faf6; --ink:#1d2827; --muted:#5a6b68; --line:#c9d6cf;
  --rust:#d4572a; --mustard:#e2a92f; --teal:#2a7a73; --teal-soft:#d3e8e3;
  --go:#3d8a3e; --go-soft:#dcebd5; --amber:#e2a02a; --amber-soft:#f8e7c4; --grey:#a9b2ae; --grey-soft:#e3e7e5;
  --road:#5b5e5a; --roadline:#f3e9cf; --trail:#e2a92f;
  --land:#d9e3b9; --land2:#c8d79e; --water:#a9d0d6; --deco:#7d9a52; --deco2:#b98a4e;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Karla","Segoe UI",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 0 rgba(29,40,39,.08),0 6px 18px -10px rgba(29,40,39,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121b1a; --panel:#1a2524; --ink:#e8efe9; --muted:#9db0ab; --line:#2c3b39;
  --rust:#ef7a4c; --mustard:#f0bd4f; --teal:#5cc0b5; --teal-soft:#1d3532;
  --go:#6cc070; --go-soft:#1e3420; --amber:#f0b84a; --amber-soft:#3b2e14; --grey:#5f6b67; --grey-soft:#26302e;
  --road:#3a3d3b; --roadline:#c9bd9c; --trail:#f0bd4f;
  --land:#29351f; --land2:#314027; --water:#1f3b44; --deco:#4f6b33; --deco2:#7a5a33;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121b1a; --panel:#1a2524; --ink:#e8efe9; --muted:#9db0ab; --line:#2c3b39;
  --rust:#ef7a4c; --mustard:#f0bd4f; --teal:#5cc0b5; --teal-soft:#1d3532;
  --go:#6cc070; --go-soft:#1e3420; --amber:#f0b84a; --amber-soft:#3b2e14; --grey:#5f6b67; --grey-soft:#26302e;
  --road:#3a3d3b; --roadline:#c9bd9c; --trail:#f0bd4f;
  --land:#29351f; --land2:#314027; --water:#1f3b44; --deco:#4f6b33; --deco2:#7a5a33;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}
/* per-map terrain */
.world[data-map="snow"]{--land:#eef3f6; --land2:#dde8ee; --water:#bcd6e6; --deco:#3f6b5a; --deco2:#ffffff}
.world[data-map="jungle"]{--land:#bfdc9c; --land2:#a6cd7f; --water:#8cc9d3; --deco:#3e7a3a; --deco2:#7a5a2e}
.world[data-map="golf"]{--land:#c9e3a5; --land2:#b2d68a; --water:#a3d1dc; --deco:#4c8a3f; --deco2:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .world[data-map="snow"]{--land:#25333a; --land2:#2c3d45; --water:#1c3444; --deco:#3c6656; --deco2:#c7d6de}
 :root:not([data-theme="light"]) .world[data-map="jungle"]{--land:#22381f; --land2:#2a4526; --water:#173a40; --deco:#3f7a3a; --deco2:#6e532c}
 :root:not([data-theme="light"]) .world[data-map="golf"]{--land:#253a20; --land2:#2d4727; --water:#1b3a42; --deco:#4c8a3f; --deco2:#c7d6de}}
:root[data-theme="dark"] .world[data-map="snow"]{--land:#25333a; --land2:#2c3d45; --water:#1c3444; --deco:#3c6656; --deco2:#c7d6de}
:root[data-theme="dark"] .world[data-map="jungle"]{--land:#22381f; --land2:#2a4526; --water:#173a40; --deco:#3f7a3a; --deco2:#6e532c}
:root[data-theme="dark"] .world[data-map="golf"]{--land:#253a20; --land2:#2d4727; --water:#1b3a42; --deco:#4c8a3f; --deco2:#c7d6de}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header + loader */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:18px;align-items:end}
.brand h1{font-family:var(--display);font-size:clamp(28px,4vw,44px);line-height:1}
.brand h1 .q{color:var(--rust)}
.brand p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.stripe{height:10px;border-radius:2px;background:linear-gradient(90deg,var(--rust) 0 33%,var(--mustard) 33% 66%,var(--teal) 66%)}
.drop{border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:14px 16px;display:flex;gap:14px;align-items:center;transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.tape{flex:none;width:64px;height:42px;border-radius:6px;background:var(--ink);position:relative}
.tape::before{content:"";position:absolute;inset:6px 6px 15px;border-radius:2px;background:var(--mustard)}
.tape::after{content:"";position:absolute;left:15px;right:15px;bottom:5px;height:8px;border-radius:6px;background:radial-gradient(circle at 5px 50%,var(--panel) 2px,transparent 3px),radial-gradient(circle at calc(100% - 5px) 50%,var(--panel) 2px,transparent 3px),var(--muted)}
.drop b{font-weight:700}
.drop .hint{font-size:13px;color:var(--muted)}
.drop code{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--rust)} .status.ok{color:var(--go)}

/* map tabs */
.maps{display:flex;gap:10px;flex-wrap:wrap}
.sign{border:2px solid var(--ink);background:var(--panel);border-radius:8px;padding:8px 14px 7px;display:flex;flex-direction:column;align-items:flex-start;min-width:170px;box-shadow:var(--shadow)}
.sign .n{font-family:var(--display);font-size:15px;line-height:1.1}
.sign .pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sign[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.sign[aria-selected="true"] .pct{color:#fff;opacity:.85}

/* world */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:stretch}
.world{background:var(--land);border-radius:16px;overflow-x:auto;box-shadow:var(--shadow);position:relative}
.world svg{display:block;width:100%;min-width:760px;height:auto}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible .badge{stroke:var(--mustard);stroke-width:5}
.node:hover .badge{transform:scale(1.08)}
.badge{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.rv{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 2px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.side{display:flex;flex-direction:column;gap:10px}
.gauge{background:var(--panel);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.gauge .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;line-height:1}
.gauge .v small{font-size:14px;color:var(--muted);font-weight:400}
.bar{height:7px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--go);border-radius:7px;transition:width .4s}
.gauge.cp .bar i{background:var(--mustard)}
.gauge .sub{font-size:12.5px;color:var(--muted)}

/* filter bar */
.bar2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb h2{font-family:var(--display);font-size:18px}
.crumb .count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.stepper{display:flex;gap:4px}
.stepper button{border:1.5px solid var(--line);background:transparent;border-radius:8px;width:32px;height:32px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:14px;flex-wrap:wrap}

/* items */
.section-h{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.section-h h3{font-family:var(--display);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{background:var(--panel);border-radius:10px;padding:11px 14px 11px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 12px;align-items:center;position:relative;box-shadow:var(--shadow);overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.item.is-found::before{background:var(--go)} .item.is-missing::before{background:var(--amber)}
.ico{grid-row:span 2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--bg)}
.ico svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item .nm{font-weight:700;line-height:1.25}
.item .meta{grid-column:2/4;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .yt{grid-row:1;grid-column:3;font-size:12px;color:var(--muted);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.item .yt:hover{border-color:var(--rust);color:var(--ink)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.pill.found{background:var(--go-soft);color:var(--go)} .pill.missing{background:var(--amber-soft);color:var(--ink)} .pill.unknown{background:var(--bg);color:var(--muted)}
.cpchip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:transparent;border-radius:4px;padding:0 5px;color:var(--muted)}
.cpchip:hover{border-color:var(--ink);color:var(--ink)}
.cpchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);padding:18px;background:var(--panel);border-radius:10px}
.foot{font-size:13px;color:var(--muted);max-width:90ch;margin:0}
@media (max-width:980px){.top{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.side{grid-template-columns:1fr}.sign{min-width:0;flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>RV There Yet<span class="q">?</span> Collectibles</h1>
      <p>Every hat, pair of glasses and cassette tape, placed at the checkpoint it's nearest to. Load your save to see which stops still have something for you.</p>
    </div>

        <span><i style="background:var(--grey)"></i>Not reached yet</span>

    </div>
    <aside class="side" id="gauges"></aside>
  </section>

  <div class="bar2">

      <div class="chips" id="stateChips" role="group" aria-label="Status"></div>
    </div>
  </div>

  <div id="items"></div>
  <p class="foot" id="foot"></p>
</div>

function parseSav(buf){
  const u=new Uint8Array(buf);
  if (u.length<4||String.fromCharCode(u[0],u[1],u[2],u[3])!=='GVAS') throw new Error('That isn’t an RV There Yet? save. Pick PlayerProgression--1.sav.');
  const tokens=new Set(); let s='';
  for (let i=0;i<u.length;i++){const b=u[i]; if(b>=32&&b<127) s+=String.fromCharCode(b); else {if(s.length>=4) tokens.add(s); s='';}}
  const cps={}; const dv=new DataView(buf); const pat=[76,101,118,101,108,46];
  for (let i=0;i<u.length-6;i++){
    let ok=true; for(let j=0;j<6;j++) if(u[i+j]!==pat[j]){ok=false;break}
    if(!ok) continue;
    let e=i; while(e<u.length&&u[e]!==0) e++;
    const tag=String.fromCharCode(...u.slice(i,e)); const p=e+1;
    if (p+13<=u.length&&dv.getInt32(p,true)===5&&String.fromCharCode(...u.slice(p+4,p+8))==='None'){const v=dv.getInt32(p+9,true); if(v>=0&&v<1000) cps[tag]=v;}
  }
  return {tokens,cps};
}
function parseJson(text){
  const j=JSON.parse(text); const tokens=new Set(); const cps={};
  (function walk(x){ if(typeof x==='string'){tokens.add(x); const seg=x.split(/[\/.]/).pop(); if(seg) tokens.add(seg); return;} if(Array.isArray(x)) return x.forEach(walk); if(x&&typeof x==='object') Object.values(x).forEach(walk); })(j);
  for (const e of (j.CheckpointProgression||[])){const t=e&&e.Key&&e.Key.TagName; if(t&&typeof e.Value==='number') cps[t]=e.Value;}
  if (!tokens.size) throw new Error('That JSON has nothing in it from RV There Yet?.');
  return {tokens,cps};
}

    const r=(first===0x7b||first===0x5b)?parseJson(new TextDecoder().decode(buf)):parseSav(buf);
    S.tokens=r.tokens; S.cps=r.cps; S.file=f.name;
    store.set('rv-last',{tokens:[...r.tokens].filter(t=>/^(SM_|MSS_|Level\.)/.test(t)),cps:r.cps,file:f.name});

  }catch(e){ st.className='status err'; st.textContent=e.message||'Couldn’t read that file.'; }
}

function cpState(m,n){

}

const W=1200,H=470,PAD=62;
function layout(m){
  const pts=m.cps.map(c=>({n:c.n,x:c.x,y:c.y}));
  if (pts.length===1) return [{n:pts[0].n,x:W/2,y:H/2}];
  let xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  let swap=(Math.max(...ys)-Math.min(...ys))>(Math.max(...xs)-Math.min(...xs));
  let P=pts.map(p=>swap?{n:p.n,x:p.y,y:-p.x}:{n:p.n,x:p.x,y:-p.y});
  xs=P.map(p=>p.x); ys=P.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-2*PAD)/(x1-x0||1),(H-2*PAD-14)/(y1-y0||1));
  const ox=(W-(x1-x0)*sc)/2, oy=(H-14-(y1-y0)*sc)/2;
  P=P.map(p=>({n:p.n,x:ox+(p.x-x0)*sc,y:oy+(p.y-y0)*sc}));
  for (let it=0;it<120;it++){ /* push apart stops that overlap */
    for (let i=0;i<P.length;i++) for (let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j]; let dx=b.x-a.x,dy=b.y-a.y; const d=Math.hypot(dx,dy)||0.01; const min=62;
      if (d<min){ const f=(min-d)/2/d; dx*=f; dy*=f; a.x-=dx;a.y-=dy;b.x+=dx;b.y+=dy; }
    }
    for (const p of P){ p.x=Math.max(PAD-20,Math.min(W-PAD+20,p.x)); p.y=Math.max(PAD-24,Math.min(H-PAD,p.y)); }
  }
  return P;
}
function curve(P){
  if (P.length<2) return '';
  let d=`M${P[0].x},${P[0].y}`;
  for (let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    d+=` C${p1.x+(p2.x-p0.x)/6},${p1.y+(p2.y-p0.y)/6} ${p2.x-(p3.x-p1.x)/6},${p2.y-(p3.y-p1.y)/6} ${p2.x},${p2.y}`;
  }
  return d;
}
function decoShape(kind,x,y,s){
  if (kind==='pine') return sv('g',{},sv('path',{d:`M${x} ${y-16*s} l${9*s} ${16*s} h${-18*s}z`,fill:'var(--deco)'}),sv('path',{d:`M${x} ${y-16*s} l${4*s} ${7*s} h${-8*s}z`,fill:'var(--deco2)'}));
  if (kind==='palm') return sv('g',{},sv('path',{d:`M${x} ${y} q${2*s} ${-9*s} ${-1*s} ${-16*s}`,stroke:'var(--deco2)','stroke-width':2.5*s,fill:'none'}),sv('ellipse',{cx:x-5*s,cy:y-16*s,rx:6*s,ry:2.6*s,fill:'var(--deco)'}),sv('ellipse',{cx:x+4*s,cy:y-17*s,rx:6*s,ry:2.6*s,fill:'var(--deco)'}));
  if (kind==='flag') return sv('g',{},sv('path',{d:`M${x} ${y} v${-18*s}`,stroke:'var(--ink)','stroke-width':1.5}),sv('path',{d:`M${x} ${y-18*s} l${10*s} ${4*s} l${-10*s} ${4*s}z`,fill:'var(--rust)'}));
  return sv('g',{},sv('path',{d:`M${x-12*s} ${y} l${5*s} ${-12*s} h${14*s} l${5*s} ${12*s}z`,fill:'var(--deco2)',opacity:.8}),sv('path',{d:`M${x+18*s} ${y} v${-11*s} m0 ${5*s} h${-4*s} v${-4*s} m${4*s} ${4*s}`,stroke:'var(--deco)','stroke-width':2.4*s,fill:'none','stroke-linecap':'round'}));
}
function drawWorld(){
  const m=cur(); const svg=$('#ow'); $('#world').dataset.map=m.id;
  const P=layout(m); const r=reachedOf(m); const R=rng(m.id.length*7919+m.cps.length);
  const g=[];
  g.push(sv('rect',{x:0,y:0,width:W,height:H,fill:'var(--land)'}));
  for (let i=0;i<7;i++) g.push(sv('ellipse',{cx:R()*W,cy:R()*H,rx:90+R()*160,ry:40+R()*70,fill:'var(--land2)'}));
  for (let i=0;i<2;i++) g.push(sv('ellipse',{cx:R()*W,cy:R()*H,rx:60+R()*90,ry:22+R()*30,fill:'var(--water)',opacity:.9}));
  const d=curve(P);
  /* scatter scenery away from the road */
  const near=(x,y)=>P.some(p=>Math.hypot(p.x-x,p.y-y)<70);
  let placed=0,tries=0; const sample=[];
  if (d){ const tmp=sv('path',{d}); svg.replaceChildren(tmp); const L=tmp.getTotalLength(); for(let s=0;s<=L;s+=25){const q=tmp.getPointAtLength(s); sample.push(q);} }
  const nearRoad=(x,y)=>sample.some(q=>Math.hypot(q.x-x,q.y-y)<34);
  while (placed<34&&tries<600){ tries++; const x=20+R()*(W-40), y=30+R()*(H-50); if(near(x,y)||nearRoad(x,y)) continue; g.push(decoShape(m.deco,x,y,0.8+R()*0.6)); placed++; }
  if (d){
    g.push(sv('path',{d,fill:'none',stroke:'var(--road)','stroke-width':20,'stroke-linecap':'round','stroke-linejoin':'round'}));
    g.push(sv('path',{d,fill:'none',stroke:'var(--roadline)','stroke-width':2.5,'stroke-dasharray':'10 12','stroke-linecap':'round'}));
    if (r!=null&&r>0){ const k=P.findIndex(p=>p.n===r); if(k>0) g.push(sv('path',{d:curve(P.slice(0,k+1)),fill:'none',stroke:'var(--trail)','stroke-width':5,'stroke-linecap':'round','stroke-dasharray':'2 9'})); }
  }
  /* stops */
  for (const p of P){
    const st=cpState(m,p.n); const sel=S.sel===p.n;
    const fill=st.k==='go'?'var(--go)':st.k==='amber'?'var(--amber)':'var(--grey)';
    const txt=st.k==='amber'?'#1d2827':'#ffffff';
    const R1=24, C=2*Math.PI*R1, frac=st.tot?st.got/st.tot:0;
    const node=sv('g',{class:'node',tabindex:'0',role:'button','aria-pressed':String(sel),'aria-label':`${cpLabel(p.n)}: ${st.got} of ${st.tot} found`});
    node.append(sv('title',{},`${cpLabel(p.n)} · ${S.tokens?st.got+' of '+st.tot+' found':st.tot+' collectibles'}`));
    if (sel) node.append(sv('circle',{cx:p.x,cy:p.y,r:33,fill:'none',stroke:'var(--ink)','stroke-width':3,'stroke-dasharray':'5 4'}));
    node.append(sv('circle',{cx:p.x,cy:p.y,r:R1,fill:'var(--panel)',stroke:'var(--line)','stroke-width':4}));
    if (S.tokens&&st.tot) node.append(sv('circle',{cx:p.x,cy:p.y,r:R1,fill:'none',stroke:'var(--go)','stroke-width':4,'stroke-dasharray':`${C*frac} ${C}`,transform:`rotate(-90 ${p.x} ${p.y})`}));
    const b=sv('g',{class:'badge'});
    b.append(sv('circle',{cx:p.x,cy:p.y,r:18,fill,stroke:'var(--panel)','stroke-width':2}));
    b.append(sv('text',{x:p.x,y:p.y+(p.n===0?4:5),'text-anchor':'middle',fill:txt,'font-family':'Bungee, Arial Black, sans-serif','font-size':p.n===0?7.5:15},p.n===0?(m.cps.length===1?'⛳':'START'):String(p.n)));
    node.append(b);
    const lbl=S.tokens?`${st.got}/${st.tot}`:String(st.tot);
    const lw=lbl.length*7.5+12;
    node.append(sv('rect',{x:p.x-lw/2,y:p.y+28,width:lw,height:17,rx:8.5,fill:'var(--panel)',stroke:'var(--line)'}));
    node.append(sv('text',{x:p.x,y:p.y+40.5,'text-anchor':'middle','font-family':'Space Mono, monospace','font-size':11,fill:'var(--ink)'},lbl));
    const go=()=>{S.sel=(S.sel===p.n?null:p.n);render();};
    node.addEventListener('click',go);
    node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
    g.push(node);
  }
  /* the RV, parked at the furthest checkpoint reached */
  if (r!=null&&m.cps.length>1){
    const p=P.find(q=>q.n===Math.min(r,P[P.length-1].n))||P[0];
    const x=p.x+22,y=p.y-46;
    g.push(sv('g',{class:'rv','aria-hidden':'true'},
      sv('rect',{x,y,width:40,height:20,rx:4,fill:'var(--rust)',stroke:'var(--ink)','stroke-width':1.5}),
      sv('rect',{x:x+30,y:y+4,width:10,height:16,rx:2,fill:'var(--rust)',stroke:'var(--ink)','stroke-width':1.5}),
      sv('rect',{x:x+4,y:y+4,width:9,height:7,rx:1,fill:'#f3e9cf'}),sv('rect',{x:x+16,y:y+4,width:9,height:7,rx:1,fill:'#f3e9cf'}),sv('rect',{x:x+32,y:y+6,width:6,height:6,rx:1,fill:'#f3e9cf'}),
      sv('rect',{x,y:y+12,width:30,height:2.5,fill:'var(--mustard)'}),
      sv('circle',{cx:x+9,cy:y+21,r:4,fill:'var(--ink)'}),sv('circle',{cx:x+32,cy:y+21,r:4,fill:'var(--ink)'})));
  }
  svg.replaceChildren(...g);
}

/* ---------- page ---------- */
function render(){
  const m=cur();
  if (S.sel!=null&&!m.cps.some(c=>c.n===S.sel)) S.sel=null;
  const st=$('#status');
  if (S.tokens){const all=MAPS.flatMap(x=>x.items);const ids=[...new Set(all.map(i=>i.id))];const n=ids.filter(id=>S.tokens.has(id)).length;st.className='status ok';st.textContent=(S.file||'Save')+' loaded: '+n+' of '+ids.length+' collectibles found.';}

  $('#maps').replaceChildren(...MAPS.map(x=>{const f=x.items.filter(has).length;return el('button',{class:'sign',role:'tab','aria-selected':String(S.map===x.id),type:'button',onclick:()=>{S.map=x.id;S.sel=null;savePrefs();render();}},el('span',{class:'n'},x.name),el('span',{class:'pct'},S.tokens?f+' / '+x.items.length+' found':x.items.length+' collectibles'));}));

  drawWorld();

  const cos=m.items.filter(i=>i.type!=='tape'),tp=m.items.filter(i=>i.type==='tape'),r=reachedOf(m),last=m.cps[m.cps.length-1].n;
  const gauge=(label,got,tot,sub,cls='')=>el('div',{class:'gauge '+cls},el('span',{class:'label'},label),el('div',{class:'v'},S.tokens&&got!=null?String(got):'–',el('small',{},' / '+tot)),el('div',{class:'bar'},Object.assign(el('i'),{style:'width:'+(S.tokens&&got!=null&&tot?Math.round(got/tot*100):0)+'%'})),el('span',{class:'sub'},sub));
  const cf=cos.filter(has).length,tf=tp.filter(has).length;
  $('#gauges').replaceChildren(
    gauge('Cosmetics',cf,cos.length,S.tokens?(cos.length-cf)+' still to find':'Load a save to count'),
    tp.length?gauge('Cassette tapes',tf,tp.length,S.tokens?(tp.length-tf)+' still to hear':'Load a save to count'):gauge('Cassette tapes',null,0,'No tapes here'),
    last>0?gauge('Checkpoints',r,last,S.tokens?(r>=last?'All reached':'Furthest reached'):'Load a save to count','cp'):gauge('Checkpoints',null,0,'No checkpoints here','cp'));

  /* crumb */
  const inSel=it=>S.sel==null||it.cps.includes(S.sel);
  const scope=m.items.filter(inSel);
  $('#allBtn').setAttribute('aria-pressed',String(S.sel==null));
  $('#crumbT').textContent=S.sel==null?m.name+', all stops':cpLabel(S.sel);
  $('#crumbC').textContent=S.tokens?scope.filter(has).length+' of '+scope.length+' found':scope.length+' collectibles';

  const chip=(group,val,label)=>el('button',{class:'chip',type:'button','aria-pressed':String(S[group]===val),onclick:()=>{S[group]=val;savePrefs();render();}},label);
  $('#typeChips').replaceChildren(chip('type','all','Everything'),chip('type','hat','Hats'),chip('type','glasses','Glasses'),chip('type','tape','Tapes'));
  $('#stateChips').replaceChildren(chip('show','all','All'),chip('show','missing','Missing'),chip('show','found','Found'));

  const pass=it=>inSel(it)&&(S.type==='all'||S.type===it.type)&&(S.show==='all'||!S.tokens||(S.show==='found')===has(it));
  const out=[];
  for (const [title,type] of [['Hats','hat'],['Glasses','glasses'],['Cassette tapes','tape']]){
    const list=m.items.filter(i=>i.type===type&&pass(i)); if(!list.length) continue;
    const all=m.items.filter(i=>i.type===type&&inSel(i));
    out.push(el('div',{class:'section-h'},el('h3',{},title),el('span',{class:'label'},S.tokens?all.filter(has).length+' of '+all.length:all.length+' total')));
    out.push(el('div',{class:'grid'},list.map(card)));
  }
  if (!out.length) out.push(el('div',{class:'empty'},S.show==='missing'&&S.tokens?'Nothing missing here. Everything at this stop is yours.':'Nothing here matches these filters.'));
  $('#items').replaceChildren(...out);

  $('#foot').textContent='Positions come from the game’s own map files (version 1.4). Each item is listed under the checkpoint nearest to where it sits; hats and glasses are stocked in several shops, so they can show up at more than one stop. '+'Six tapes have audio in the game files but are never placed on any map, so they aren’t listed: Self Help, Euro Trash Anthem, Alien Hard Style, and Archibald’s The Devas, The Gambit and Old Man Starik.';
}
function card(it){
  const f=S.tokens?has(it):null; const m=cur();
  const other=it.type==='tape'?(tapeHome[it.id]||[]).filter(n=>n!==m.name):[];
  const q=encodeURIComponent('RV There Yet '+m.name+' '+it.name+(it.type==='tape'?' cassette tape':'')+' location');
  return el('div',{class:'item '+(f===null?'':f?'is-found':'is-missing')},
    icon(it.type),
    el('span',{class:'nm'},it.name),
    el('a',{class:'yt',href:'https://www.youtube.com/results?search_query='+q,target:'_blank',rel:'noopener'},'Search ↗'),
    el('span',{class:'meta'},
      el('span',{class:'pill '+(f===null?'unknown':f?'found':'missing')},f===null?'not checked':f?'found':'missing'),
      it.type==='tape'?el('span',{},it.kind):null,
      it.starter?el('span',{},'Starter outfit'):null,
      ...it.cps.map(n=>el('button',{class:'cpchip'+(S.sel===n?' on':''),type:'button',title:'Show '+cpLabel(n),onclick:()=>{S.sel=n;render();showMap();}},n===0?'Start':'CP'+n)),
      other.length?el('span',{},'also in '+other.join(', ')):null));
}
function showMap(){
  const w=$('#world'); const top=w.getBoundingClientRect().top;
  if (top>=0 && top<innerHeight*0.5) return;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(()=>w.scrollIntoView({behavior:still?'auto':'smooth',block:'start'}));
}
function step(d){const m=cur();const ns=m.cps.map(c=>c.n);let i=S.sel==null?(d>0?-1:ns.length):ns.indexOf(S.sel);i+=d;S.sel=(i<0||i>=ns.length)?null:ns[i];render();}
$('#allBtn').onclick=()=>{S.sel=null;render();};
$('#prev').onclick=()=>step(-1); $('#next').onclick=()=>step(1);

const drop=$('#drop');
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value='';});
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadFile(f);});
render();
</script>
